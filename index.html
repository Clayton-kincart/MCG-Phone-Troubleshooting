<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No Dial Tone Troubleshooting v2</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    max-width:800px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.primary{
    background:#0078d4;
    color:white;
}

.yes{
    background:#28a745;
    color:white;
}

.no{
    background:#dc3545;
    color:white;
}

.secondary{
    background:#cccccc;
}

#path{
    margin-bottom:15px;
    color:#666;
    font-size:.9em;
}

.footer{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<h1>No Dial Tone Troubleshooting</h1>

<div id="path"></div>

<div class="card" id="app"></div>

<div class="footer">
    <button class="secondary" onclick="back()">Back</button>
    <button class="secondary" onclick="resetFlow()">Start Over</button>
</div>

<script>

const steps = {

start:{
    title:"No Dial Tone",
    detail:"Plug a known-good phone directly into the ONT.",
    actions:[
        {text:"Continue",next:"dialTone",class:"primary"}
    ]
},

dialTone:{
    title:"Did you get dial tone?",
    actions:[
        {text:"Yes",next:"readback311",class:"yes"},
        {text:"No",next:"isPort",class:"no"}
    ]
},

/* NO DIAL TONE BRANCH */

isPort:{
    title:"Is it a port?",
    detail:"Have you called the CSR staff to port the number?",
    actions:[
        {text:"Yes",next:"checkProvisioning",class:"yes"},
        {text:"No",next:"callCSR",class:"no"}
    ]
},

checkProvisioning:{
    title:"Support Action",
    result:true,
    detail:"Call Support to check provisioning."
},

callCSR:{
    title:"CSR Action",
    result:true,
    detail:"Call CSR staff to port the number."
},

/* DIAL TONE BRANCH */

readback311:{
    title:"Call 311. Does it read back to you?",
    actions:[
        {text:"Yes",next:"callOffice",class:"yes"},
        {text:"No",next:"metaRegistration",class:"no"}
    ]
},

callOffice:{
    title:"Can you call the office?",
    actions:[
        {text:"Yes",next:"callCell",class:"yes"},
        {text:"No",next:"metaRegistration",class:"no"}
    ]
},

callCell:{
    title:"Call your cell phone from the test phone",
    detail:"This verifies outbound calling and long distance routing.",
    actions:[
        {text:"Continue",next:"cellRang",class:"primary"}
    ]
},

cellRang:{
    title:"Did your cell phone ring?",
    actions:[
        {text:"Yes",next:"callBack",class:"yes"},
        {text:"No",next:"picCheck",class:"no"}
    ]
},

callBack:{
    title:"Call the phone number back from your cell",
    detail:"Verify inbound calling.",
    actions:[
        {text:"Continue",next:"phoneRang",class:"primary"}
    ]
},

phoneRang:{
    title:"Did the phone ring?",
    actions:[
        {text:"Yes",next:"internalWiring",class:"yes"},
        {text:"No",next:"picCheck",class:"no"}
    ]
},

internalWiring:{
    title:"Voice Service Verified",
    result:true,
    detail:"Outbound and inbound calling work. Check internal wiring and connections."
},

picCheck:{
    title:"Support Action",
    result:true,
    detail:"Call Support. Check WTN Management for PIC and Long Distance service."
},

metaRegistration:{
    title:"Support Action",
    result:true,
    detail:"Call Support. Check Meta registration. Verify port completion. If the port has not completed, contact CSR."
}

};

let current="start";
let history=[];
let trail=[];

function render(){

    const step=steps[current];

    document.getElementById("path").innerHTML =
        trail.length
        ? "<strong>Path:</strong> " + trail.join(" ➜ ")
        : "";

    let html=`<h2>${step.title}</h2>`;

    if(step.detail){
        html+=`<p>${step.detail}</p>`;
    }

    if(step.result){

        html+=`
        <div class="buttons">
            <button class="primary" onclick="resetFlow()">
                Start Over
            </button>
        </div>
        `;

    }else{

        html+=`<div class="buttons">`;

        step.actions.forEach(action=>{
            html+=`
            <button
                class="${action.class}"
                onclick="go('${action.next}','${action.text}')">
                ${action.text}
            </button>
            `;
        });

        html+=`</div>`;
    }

    document.getElementById("app").innerHTML=html;
}

function go(next,label){
    history.push(current);
    trail.push(label);
    current=next;
    render();
}

function back(){

    if(history.length===0){
        return;
    }

    current=history.pop();
    trail.pop();
    render();
}

function resetFlow(){
    current="start";
    history=[];
    trail=[];
    render();
}

render();

</script>

</body>
</html>
